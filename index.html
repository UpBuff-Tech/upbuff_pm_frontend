<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fiëro - Upbuff Project Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Fiëro by Upbuff — project, task and team management" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" href="/img/logo.png" />

  <!-- Libraries the old app got from Meteor packages (same versions) -->
  <link rel="stylesheet" href="/vendor/toastr.min.css" />
  <link rel="stylesheet" href="/vendor/select2.min.css" />
  <link rel="stylesheet" href="/vendor/cropper.css" />
  <link rel="stylesheet" href="/vendor/font-awesome/css/font-awesome.css" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css" />

  <!-- Core CSS (Sneat theme) -->
  <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css" />
  <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css" />
  <link rel="stylesheet" href="/assets/css/demo.css" />

  <!-- Vendors CSS -->
  <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />
  <link rel="stylesheet" href="/assets/vendor/libs/apex-charts/apex-charts.css" />

  <!-- Page CSS -->
  <link rel="stylesheet" href="/assets/vendor/css/pages/page-auth.css" />
  <link rel="stylesheet" href="/assets/vendor/css/pages/page-icons.css" />

  <!-- jQuery and its plugins are plain globals ($, toastr, select2), as they were in the Meteor app.
       "defer" keeps their order and still runs them before the app (/src/main.jsx), but lets the
       page paint the loader below instead of staying white while ~1.5 MB of scripts download. -->
  <script defer src="/vendor/jquery.min.js"></script>
  <script defer src="/vendor/select2.full.min.js"></script>
  <script defer src="/vendor/toastr.min.js"></script>
  <script defer src="/vendor/cropper.js"></script>
  <script defer src="/vendor/printThis.js"></script>

  <!-- Helpers -->
  <script defer src="/assets/js/config.js"></script>
  <script defer src="/assets/vendor/js/helpers.js"></script>
  <script defer src="/assets/vendor/js/bootstrap.js"></script>
  <script defer src="/assets/vendor/js/bootstrap1.js"></script>
  <script defer src="https://cdn.jsdelivr.net/gh/linways/table-to-excel@v1.0.4/dist/tableToExcel.js"></script>
  <!-- SortableJS for drag and drop -->
  <script defer src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <!-- Styles for the boot loader below (same look as components/loader/PageLoader) -->
  <style>
    .fx-boot-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f5f7fb; }
    .fx-boot-orbit { position: relative; width: 64px; height: 64px; }
    .fx-boot-ring { position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(79, 70, 229, 0) 0deg, #6366f1 220deg, #22c55e 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      animation: fx-boot-spin 0.9s linear infinite; }
    .fx-boot-mark { position: absolute; inset: 18px; width: 28px; height: 28px; object-fit: contain; }
    @keyframes fx-boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Shown until React starts; React replaces everything inside #root when it mounts. -->
  <div id="root">
    <div class="fx-boot-loader" role="status" aria-label="Loading">
      <div class="fx-boot-orbit">
        <span class="fx-boot-ring"></span>
        <img src="/img/logo.png" alt="" class="fx-boot-mark" />
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
